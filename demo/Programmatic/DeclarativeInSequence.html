<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic Declarative In Sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- No be-reformable attribute at all -- the enhancement config is
         registered first, then properties are set via the `.set` proxy. -->
    <link id=newton-microservice rel=preconnect href=https://newton.now.sh/ >
    <form id=form>
        <label>header: <input id=myHeader value=hello></label>
        <label>Operation: <input :operation value=integrate></label>
        <label>Expression: <input :expression value="x^2"></label>
    </form>
    <p>Edit the inputs -- the form's action and the fetch-ready options update:</p>
    <pre id=output></pre>
    <script type=module>
        import {defBeReformable} from 'be-reformable/def.js';
        form.addEventListener('fetch-ready', e => {
            output.textContent = JSON.stringify({action: form.action, options: e.options}, null, 2);
        });
        await defBeReformable(document.body);
        // Only the first `.set` access per enhKey needs to go through `.set` --
        // it triggers attachment. Later property writes can go straight to
        // `.enh.beReformable`.
        form.enh.set.beReformable.baseLink = 'newton-microservice';
        Object.assign(form.enh.beReformable, {
            path: 'api/v2/:operation/:expression',
            headers: {myCustomHeader: 'goodbye'},
            headerFields: ['#myHeader'],
        });
    </script>
</body>
</html>
