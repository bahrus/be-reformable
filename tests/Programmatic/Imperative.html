<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic Imperative</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Fully imperative attachment: no attribute, no `.set` proxy -- just
         `enh.get(emc)` plus a direct property assignment. -->
    <link id=newton-microservice rel=preconnect href=https://newton.now.sh/ >
    <form id=form>
        <label>header: <input id=myHeader value=hello></label>
        <label>Operation: <input :operation value=integrate></label>
        <label>Expression: <input :expression value="x^2"></label>
    </form>
    <script type=module>
        import {defBeReformable} from '/def.js';
        form.addEventListener('fetch-ready', e => { globalThis.__fetchReady = e.options; });
        const emc = await defBeReformable(document.body);
        // kept, so the test can check the enhancement never mutates the caller's object
        globalThis.__headers = {myCustomHeader: 'goodbye'};
        Object.assign(form.enh.get(emc), {
            baseLink: 'newton-microservice',
            path: 'api/v2/:operation/:expression',
            headers: globalThis.__headers,
            headerFields: ['#myHeader'],
        });
    </script>
</body>
</html>
