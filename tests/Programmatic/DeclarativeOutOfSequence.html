<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic Declarative Out Of Sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Properties are set via the `.set` proxy *before* the enhancement
         config is even registered. `.set` creates a plain placeholder and
         defers the real spawn until `defBeReformable` registers the config. -->
    <link id=newton-microservice rel=preconnect href=https://newton.now.sh/ >
    <form id=form>
        <label>header: <input id=myHeader value=hello></label>
        <label>Operation: <input :operation value=integrate></label>
        <label>Expression: <input :expression value="x^2"></label>
    </form>
    <script type=module>
        import {defBeReformable} from '/def.js';
        form.addEventListener('fetch-ready', e => { globalThis.__fetchReady = e.options; });
        form.enh.set.beReformable.baseLink = 'newton-microservice';
        Object.assign(form.enh.beReformable, {
            path: 'api/v2/:operation/:expression',
            headers: {myCustomHeader: 'goodbye'},
            headerFields: ['#myHeader'],
        });
        await defBeReformable(document.body);
    </script>
</body>
</html>
