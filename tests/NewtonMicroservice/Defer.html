<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defer</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <link id=newton-microservice rel=preconnect href=https://newton.now.sh/ >
    <form id=form defer-be-reformable be-reformable='{
        "baseLink": "newton-microservice",
        "path": "api/v2/:operation/:expression"
    }'
    >
        <label>
            Operation:
            <input :operation value=integrate>
        </label>
        
        <label>
            Expression:
            <input :expression value="x^2">
        </label>
        <input name="hello" value=test>
    </form>
    <div id=target></div>
    <script>
        function runScript(){
            if(form.getAttribute('action') === 'https://newton.now.sh/api/v2/integrate/x^2'){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runScript();
        }, 1000);
    </script>
</body>
</html>
