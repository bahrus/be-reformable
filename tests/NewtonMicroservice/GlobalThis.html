<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global this</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-reformable/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <link id=newton-microservice rel=preconnect href=https://newton.now.sh/ >
    <form id=testForm be-reformable='{
        "baseURL": "https://newton.now.sh/",
        "path": "api/v2/:operation/:expression",
        "headerFields": ["#myHeader"],
        "headers": {
            "myCustomHeader": "goodbye"
        }
    }'
    >
    <label>
        header:
        <input id=myHeader value=hello>
    </label>
    <label>
        Operation:
        <input :operation value=integrate>
    </label>
    
    <label>
        Expression:
        <input :expression value="x^2">
    </label>
        <input name="hello" value=test>
    </form>
    <div id=target></div>
    <script>
        testForm.addEventListener('fetch-ready', e => {
            console.log({e});
            if(e.options.headers.myCustomHeader === 'goodbye' && e.options.headers.myHeader === 'hello'){
                target.setAttribute('mark', 'good')
            }
        })
    </script>
</body>
</html>
